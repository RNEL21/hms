<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Номера — HMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
<div class="app-layout">

  <aside class="app-sidebar">
    <div class="sidebar-brand">🏨</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="s-item" data-tip="Главная"><i data-lucide="house"></i></a>
      <a href="rooms.html"     class="s-item active" data-tip="Номера"><i data-lucide="bed-double"></i></a>
      <a href="guests.html"    class="s-item" data-tip="Гости"><i data-lucide="users"></i></a>
      <a href="bookings.html"  class="s-item" data-tip="Бронирования"><i data-lucide="calendar-days"></i></a>
    </nav>
    <div class="sidebar-footer">
      <button class="s-item" id="themeBtn" data-tip="Сменить тему" onclick="theme.toggle()"><i data-lucide="moon"></i></button>
      <button onclick="doLogout()" class="s-item s-logout" data-tip="Выйти"><i data-lucide="log-out"></i></button>
    </div>
  </aside>

  <div id="mobOverlay" class="mob-overlay" onclick="sidebar.close()"></div>
  <div id="mobSidebar" class="mob-sidebar">
    <div class="mob-sidebar-header">🏨 HMS
      <button class="mob-close" onclick="sidebar.close()"><i data-lucide="x"></i></button>
    </div>
    <nav class="mob-nav">
      <a href="dashboard.html" class="mob-link"><i data-lucide="house"></i>Главная</a>
      <a href="rooms.html"     class="mob-link active"><i data-lucide="bed-double"></i>Номера</a>
      <a href="guests.html"    class="mob-link"><i data-lucide="users"></i>Гости</a>
      <a href="bookings.html"  class="mob-link"><i data-lucide="calendar-days"></i>Бронирования</a>
    </nav>
    <div class="mob-footer">
      <button class="mob-link" style="width:100%;text-align:left;font-family:inherit;" onclick="theme.toggle();sidebar.close()">
        <i data-lucide="moon" id="mobThemeIcon"></i>Сменить тему
      </button>
      <button onclick="doLogout()" class="mob-link"><i data-lucide="log-out"></i>Выйти</button>
    </div>
  </div>

  <div class="app-main">
    <header class="app-header">
      <div class="app-header-left">
        <button class="app-hamburger" onclick="sidebar.open()"><i data-lucide="menu"></i></button>
        <span class="app-header-title">Номера</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openAddRoom()">
        <i data-lucide="plus" style="width:20px;height:20px;"></i> Добавить номер
      </button>
    </header>

    <div class="app-content">
      <!-- Stats -->
      <div class="room-stats" id="roomStats"></div>

      <!-- Filter -->
      <div class="card filter-bar">
        <div class="search-wrap">
          <span class="search-icon"><i data-lucide="search"></i></span>
          <input class="search-input" id="searchRoom" placeholder="Поиск по номеру..." oninput="renderRooms()">
        </div>
        <select class="filter-select" id="filterType" onchange="renderRooms()">
          <option value="">Все типы</option>
          <option>Одноместный</option><option>Двухместный</option>
          <option>Полулюкс</option><option>Люкс</option>
        </select>
        <select class="filter-select" id="filterStatus" onchange="renderRooms()">
          <option value="">Все статусы</option>
          <option value="свободен">Свободен</option>
          <option value="занят">Занят</option>
          <option value="недоступен">Недоступен</option>
        </select>
      </div>
      <div class="rooms-grid" id="roomsGrid"></div>

      <!-- Pagination -->
      <div class="rooms-pagination" id="roomsPagination" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="roomModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="roomModalTitle">Новый номер</span>
      <button class="modal-close" onclick="modal.close('roomModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="roomId">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Номер комнаты *</label>
          <input class="form-input" id="roomNumber" placeholder="101">
          <div class="form-error" id="errRoomNumber"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Тип *</label>
          <select class="form-input form-select" id="roomType" onchange="autoPrice()">
            <option>Одноместный</option><option>Двухместный</option>
            <option>Полулюкс</option><option>Люкс</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Цена за ночь (₽) *</label>
        <input class="form-input num" id="roomPrice" type="number" min="0">
        <div class="form-error" id="errRoomPrice"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Статус</label>
        <select class="form-input form-select" id="roomStatus">
          <option value="свободен">Свободен</option>
          <option value="занят">Занят</option>
          <option value="недоступен">Недоступен</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Примечание</label>
        <input class="form-input" id="roomNote" placeholder="Например: причина недоступности" maxlength="500">
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="modal.close('roomModal')">Отмена</button>
        <button class="btn btn-primary" onclick="saveRoom()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div id="deleteRoomModal" class="modal-overlay">
  <div class="modal confirm-modal">
    <div class="confirm-body">
      <div class="confirm-icon">🗑️</div>
      <h3>Удалить номер?</h3>
      <p style="margin-top:8px;" id="deleteRoomText"></p>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="modal.close('deleteRoomModal')">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDeleteRoom()">Удалить</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/rooms.js"></script>
</body>
</html>
