<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — HMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <style>
    /* анимированный задник */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 20% 20%, rgba(0,51,153,.13) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(214,223,255,.25) 0%, transparent 60%);
      pointer-events: none;
    }
    [data-theme="dark"] body::before {
      background:
        radial-gradient(ellipse 70% 60% at 20% 20%, rgba(0,51,153,.30) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0,51,153,.15) 0%, transparent 60%);
    }
    .login-page { position: relative; z-index: 1; }
  </style>
</head>
<body>

<!-- темы -->
<div style="position:fixed;top:16px;right:16px;z-index:10;">
  <button class="theme-btn" onclick="theme.toggle()">🌙</button>
</div>

<div class="login-page">
  <div class="login-card glass">

    <!-- Logo -->
    <div class="login-logo">
      🏨 HMS
      <div class="sub">Hotel Management System</div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" onclick="switchTab('login')">Войти</button>
      <button class="tab"        onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- Login form -->
    <div class="tab-panel active" id="panel-login">
      <div class="form-group">
        <label class="form-label">Логин</label>
        <input class="form-input" id="loginUsername" placeholder="admin" autocomplete="username">
        <div class="form-error" id="errLoginUsername"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <div style="position:relative;">
          <input class="form-input" id="loginPassword" type="password"
                 placeholder="••••••••" autocomplete="current-password"
                 style="padding-right:44px;">
          <button onclick="togglePwd('loginPassword',this)"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                         background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text-3);">
            👁
          </button>
        </div>
        <div class="form-error" id="errLoginPassword"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;"
              onclick="doLogin()">
        Войти →
      </button>
      <p style="text-align:center;font-size:.82rem;color:var(--text-3);margin-top:8px;">
        Нет аккаунта? <a onclick="switchTab('register')" style="color:var(--accent);cursor:pointer;font-weight:600;">Зарегистрироваться</a>
      </p>
    </div>

    <!-- Register form -->
    <div class="tab-panel" id="panel-register">
      <div class="form-group">
        <label class="form-label">Имя</label>
        <input class="form-input" id="regName" placeholder="Иван Иванов">
        <div class="form-error" id="errRegName"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Логин</label>
        <input class="form-input" id="regUsername" placeholder="ivanov" autocomplete="username">
        <div class="form-error" id="errRegUsername"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <div style="position:relative;">
          <input class="form-input" id="regPassword" type="password"
                 placeholder="Минимум 6 символов" autocomplete="new-password"
                 style="padding-right:44px;" oninput="checkPasswordStrength(this.value)">
          <button onclick="togglePwd('regPassword',this)"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                         background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text-3);">
            👁
          </button>
        </div>
        <!-- Strength bar -->
        <div style="display:flex;gap:4px;margin-top:6px;" id="strengthBar">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="form-error" id="errRegPassword"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Повторите пароль</label>
        <input class="form-input" id="regPassword2" type="password"
               placeholder="••••••••" autocomplete="new-password">
        <div class="form-error" id="errRegPassword2"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;"
              onclick="doRegister()">
        Зарегистрироваться
      </button>
      <p style="text-align:center;font-size:.82rem;color:var(--text-3);margin-top:8px;">
        Уже есть аккаунт? <a onclick="switchTab('login')" style="color:var(--accent);cursor:pointer;font-weight:600;">Войти</a>
      </p>
    </div>

  </div>
</div>

<style>
.strength-seg {
  flex: 1; height: 4px; border-radius: 2px;
  background: var(--border); transition: background .2s;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
  /* ── Tab switch ──────────────────────────────────────── */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', ['login','register'][i] === name));
    document.querySelectorAll('.tab-panel').forEach(p =>
      p.classList.toggle('active', p.id === `panel-${name}`));
    document.querySelectorAll('.form-error').forEach(e => e.textContent = '');
    document.querySelectorAll('.form-input').forEach(i => i.classList.remove('error'));
  }

  /* ── Show/hide password ──────────────────────────────── */
  function togglePwd(id, btn) {
    const el = document.getElementById(id);
    el.type  = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
  }

  /* ── Password strength ───────────────────────────────── */
  function checkPasswordStrength(val) {
    const checks = [
      val.length >= 6,
      val.length >= 8,
      /[A-Z]/.test(val) || /[А-Я]/.test(val),
      /\d/.test(val) && /[^a-zA-Zа-яА-Я0-9]/.test(val)
    ];
    const colors = ['var(--danger)','var(--warn)','#0033CC','var(--success)'];
    const score  = checks.filter(Boolean).length;
    ['seg1','seg2','seg3','seg4'].forEach((id, i) => {
      document.getElementById(id).style.background =
        i < score ? colors[score - 1] : 'var(--border)';
    });
  }

  /* ── Login ───────────────────────────────────────────── */
  async function doLogin() {
    const ok = validateForm([
      { id:'loginUsername', errId:'errLoginUsername', required:true },
      { id:'loginPassword', errId:'errLoginPassword', required:true, minLen:3 },
    ]);
    if (!ok) return;

    const login = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    try {
      const data = await apiFetch('/api/auth/login', { method:'POST', body:{ login, password } });
      toast.success('Добро пожаловать, ' + data.user.login + '!');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (e) {
      toast.error(e.message);
    }
  }

  /* ── Register ────────────────────────────────────────── */
  async function doRegister() {
    const ok = validateForm([
      { id:'regName',      errId:'errRegName',      required:true, minLen:2 },
      { id:'regUsername',  errId:'errRegUsername',  required:true, minLen:3 },
      { id:'regPassword',  errId:'errRegPassword',  required:true, minLen:6 },
      { id:'regPassword2', errId:'errRegPassword2', required:true },
    ]);
    if (!ok) return;

    const p1 = document.getElementById('regPassword').value;
    const p2 = document.getElementById('regPassword2').value;
    if (p1 !== p2) {
      document.getElementById('regPassword2').classList.add('error');
      document.getElementById('errRegPassword2').textContent = 'Пароли не совпадают';
      return;
    }

    const login = document.getElementById('regUsername').value.trim();
    const password = p1;

    try {
      const data = await apiFetch('/api/auth/register', { method:'POST', body:{ login, password } });
      toast.success('Аккаунт создан! Добро пожаловать, ' + data.user.login + '!');
      setTimeout(() => window.location.href = 'dashboard.html', 1200);
    } catch (e) {
      toast.error(e.message);
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panel-login').classList.contains('active')) doLogin();
    else doRegister();
  });
</script>
</body>
</html>
