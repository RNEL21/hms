<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирования — HMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div class="app-layout">

  <aside class="app-sidebar">
    <div class="sidebar-brand">🏨</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="s-item" data-tip="Главная"><i data-lucide="house"></i></a>
      <a href="rooms.html"     class="s-item" data-tip="Номера"><i data-lucide="bed-double"></i></a>
      <a href="guests.html"    class="s-item" data-tip="Гости"><i data-lucide="users"></i></a>
      <a href="bookings.html"  class="s-item active" data-tip="Бронирования"><i data-lucide="calendar-days"></i></a>
    </nav>
    <div class="sidebar-footer">
      <button class="s-item" id="themeBtn" data-tip="Сменить тему" onclick="theme.toggle()"><i data-lucide="moon"></i></button>
      <button onclick="doLogout()" class="s-item s-logout" data-tip="Выйти"><i data-lucide="log-out"></i></button>
    </div>
  </aside>

  <div id="mobOverlay" class="mob-overlay" onclick="sidebar.close()"></div>
  <div id="mobSidebar" class="mob-sidebar">
    <div class="mob-sidebar-header">🏨 HMS
      <button class="mob-close" onclick="sidebar.close()"><i data-lucide="x"></i></button>
    </div>
    <nav class="mob-nav">
      <a href="dashboard.html" class="mob-link"><i data-lucide="house"></i>Главная</a>
      <a href="rooms.html"     class="mob-link"><i data-lucide="bed-double"></i>Номера</a>
      <a href="guests.html"    class="mob-link"><i data-lucide="users"></i>Гости</a>
      <a href="bookings.html"  class="mob-link active"><i data-lucide="calendar-days"></i>Бронирования</a>
    </nav>
    <div class="mob-footer">
      <button class="mob-link" style="width:100%;text-align:left;font-family:inherit;" onclick="theme.toggle();sidebar.close()">
        <i data-lucide="moon" id="mobThemeIcon"></i>Сменить тему
      </button>
      <button onclick="doLogout()" class="mob-link"><i data-lucide="log-out"></i>Выйти</button>
    </div>
  </div>

  <div class="app-main">
    <header class="app-header">
      <div class="app-header-left">
        <button class="app-hamburger" onclick="sidebar.open()"><i data-lucide="menu"></i></button>
        <span class="app-header-title">Бронирования</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openAddBooking()">
        <i data-lucide="plus" style="width:20px;height: 20px;"></i> Создать бронь
      </button>
    </header>

    <div class="app-content">

      <!-- Checkout alert -->
      <div id="checkoutAlert" class="alert alert-warn" style="display:none;">
        <span class="alert-icon"><i data-lucide="triangle-alert" style="width:16px;height:16px;"></i></span>
        <div id="checkoutText"></div>
      </div>

      <!-- Filter -->
      <div class="card filter-bar">
        <div class="search-wrap">
          <span class="search-icon"><i data-lucide="search"></i></span>
          <input class="search-input" id="searchBooking"
                 placeholder="Поиск по гостю или номеру..." oninput="renderBookings()">
        </div>
        <input class="filter-select" id="dateRange"
               placeholder="Фильтр по датам" style="min-width:200px;cursor:pointer;" readonly>
        <button class="btn btn-ghost btn-sm" onclick="clearDateFilter()"
                id="clearDate" style="display:none;">✕ Сбросить</button>
        <select class="filter-select" id="filterStatus" onchange="renderBookings()">
          <option value="">Все статусы</option>
          <option value="активна">Активна</option>
          <option value="отменена">Отменена</option>
          <option value="завершена">Завершена</option>
        </select>
      </div>

      <!-- Table -->
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Гость</th><th>Номер</th>
              <th>Тип</th><th>Заезд</th><th>Выезд</th>
              <th>Статус</th><th>Действия</th>
            </tr>
          </thead>
          <tbody id="bookingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Booking Modal — injected by booking-modal.js -->

<!-- Cancel Confirm -->
<div id="cancelBookingModal" class="modal-overlay">
  <div class="modal confirm-modal">
    <div class="confirm-body">
      <div class="confirm-icon">❌</div>
      <h3>Отменить бронь?</h3>
      <p style="margin-top:8px;" id="cancelBookingText"></p>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="modal.close('cancelBookingModal')">Назад</button>
      <button class="btn btn-danger" onclick="confirmCancelBooking()">Отменить</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script src="https://cdn.jsdelivr.net/npm/imask@7/dist/imask.min.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/booking-modal.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
