<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гости — HMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
<div class="app-layout">

  <aside class="app-sidebar">
    <div class="sidebar-brand">🏨</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="s-item" data-tip="Главная"><i data-lucide="house"></i></a>
      <a href="rooms.html"     class="s-item" data-tip="Номера"><i data-lucide="bed-double"></i></a>
      <a href="guests.html"    class="s-item active" data-tip="Гости"><i data-lucide="users"></i></a>
      <a href="bookings.html"  class="s-item" data-tip="Бронирования"><i data-lucide="calendar-days"></i></a>
    </nav>
    <div class="sidebar-footer">
      <button class="s-item" id="themeBtn" data-tip="Сменить тему" onclick="theme.toggle()"><i data-lucide="moon"></i></button>
      <button onclick="doLogout()" class="s-item s-logout" data-tip="Выйти"><i data-lucide="log-out"></i></button>
    </div>
  </aside>

  <div id="mobOverlay" class="mob-overlay" onclick="sidebar.close()"></div>
  <div id="mobSidebar" class="mob-sidebar">
    <div class="mob-sidebar-header">🏨 HMS
      <button class="mob-close" onclick="sidebar.close()"><i data-lucide="x"></i></button>
    </div>
    <nav class="mob-nav">
      <a href="dashboard.html" class="mob-link"><i data-lucide="house"></i>Главная</a>
      <a href="rooms.html"     class="mob-link"><i data-lucide="bed-double"></i>Номера</a>
      <a href="guests.html"    class="mob-link active"><i data-lucide="users"></i>Гости</a>
      <a href="bookings.html"  class="mob-link"><i data-lucide="calendar-days"></i>Бронирования</a>
    </nav>
    <div class="mob-footer">
      <button class="mob-link" style="width:100%;text-align:left;font-family:inherit;" onclick="theme.toggle();sidebar.close()">
        <i data-lucide="moon" id="mobThemeIcon"></i>Сменить тему
      </button>
      <button onclick="doLogout()" class="mob-link"><i data-lucide="log-out"></i>Выйти</button>
    </div>
  </div>

  <div class="app-main">
    <header class="app-header">
      <div class="app-header-left">
        <button class="app-hamburger" onclick="sidebar.open()"><i data-lucide="menu"></i></button>
        <span class="app-header-title">Гости</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openAddGuest()">
        <i data-lucide="plus" style="width:20px;height: 20px;"></i> Добавить гостя
      </button>
    </header>

    <div class="app-content">
      <div class="card filter-bar">
        <div class="search-wrap">
          <span class="search-icon"><i data-lucide="search"></i></span>
          <input class="search-input" id="searchGuest"
                 placeholder="Поиск по имени, телефону, паспорту..." oninput="renderGuests()">
        </div>
      </div>

      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>ФИО</th><th>Телефон</th>
              <th>Паспорт</th><th>Действия</th>
            </tr>
          </thead>
          <tbody id="guestsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="guestModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="guestModalTitle">Новый гость</span>
      <button class="modal-close" onclick="modal.close('guestModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="guestId">
      <div class="form-group">
        <label class="form-label">ФИО *</label>
        <input class="form-input" id="guestName" placeholder="Иванов Иван Иванович">
        <div class="form-error" id="errGuestName"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Телефон</label>
          <input class="form-input" id="guestPhone" placeholder="+7 924 000-00-00">
          <div class="form-error" id="errGuestPhone"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="guestEmail" type="email" placeholder="email@mail.ru">
          <div class="form-error" id="errGuestEmail"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Серия и номер паспорта *</label>
        <input class="form-input" id="guestPassport" placeholder="2507 842156">
        <div class="form-error" id="errGuestPassport"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Скан паспорта (.jpg)</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <div class="form-input" id="scanPathLabel"
               style="flex:1;color:var(--text-3);font-size:.85rem;cursor:default;">
            файл не выбран
          </div>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('scanInput').click()">
            Выбрать
          </button>
        </div>
        <input type="file" id="scanInput" accept=".jpg,.jpeg" style="display:none" onchange="handleScan(this)">
        <div class="form-error" id="errGuestScan"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="modal.close('guestModal')">Отмена</button>
        <button class="btn btn-primary" onclick="saveGuest()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div id="deleteGuestModal" class="modal-overlay">
  <div class="modal confirm-modal">
    <div class="confirm-body">
      <div class="confirm-icon">🗑️</div>
      <h3>Удалить гостя?</h3>
      <p style="margin-top:8px;" id="deleteGuestText"></p>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="modal.close('deleteGuestModal')">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDeleteGuest()">Удалить</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/imask@7/dist/imask.min.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/guests.js"></script>
</body>
</html>
